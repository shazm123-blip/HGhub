[package]
name = "huangguo-client"
version = "1.2.1"
description = "HGhub · 黄果短剧客户端"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "huangguo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# 注意：system-proxy 必须显式列出。关掉 default-features 会连带丢掉它，
# 客户端就完全不看 Windows 系统代理（注册表 ProxyEnable/ProxyServer）而直连，
# 症状正是「浏览器能开官网、HGhub 打不开」。见 src/net.rs 顶部说明。
reqwest = { version = "0.12", default-features = false, features = [
  "http2",
  "system-proxy",
  "gzip",
  "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
# dx150-edge-v1 接口加密（ECDH P-256 + HKDF-SHA256 + AES-256-GCM）及本地代理随机令牌
ring = "0.17"
url = "2"

# Apple 平台改用系统 Security.framework（native-tls-alpn），移除内置 rustls + webpki-roots 证书库，大幅缩减二进制体积并自动信任系统证书
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn"] }

# Windows / Linux / Android 继续使用纯 Rust rustls-tls，免去 OpenSSL 交叉编译与系统库差异
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# macOS 红绿灯垂直居中需要读取 AppKit 按钮尺寸（见 src/macos_titlebar.rs）。
# 三者均已是 tao/wry 的间接依赖，版本与 Cargo.lock 一致；只开启用到的 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[profile.release]
# Apple wry 依赖 objc2::exception::catch 捕获已取消 WKURLSchemeTask 的 ObjC 异常，
# 若设为 panic = "abort" 则外层异常无法被捕获，直接触发 SIGABRT 闪退。
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
